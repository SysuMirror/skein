[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skein-control"
version = "0.1.0"
description = "Skein control plane: tickets, scheduling, the node channel and the console API"
license = "Apache-2.0"
requires-python = ">=3.10"
# uvicorn 的 WS 支持需要单独的实现库：节点通道是一条 WebSocket
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17,<0.18", "httpx>=0.27"]

[project.scripts]
skein = "skein.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的写法就是把 Depends(...) 放在参数默认值里
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
