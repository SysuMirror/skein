name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control:
    name: control (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.10: test the floor and the newest interpreter
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: services/control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/control/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q

  node-agent:
    name: node-agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/node-agent/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test

  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/console/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/scripts/check-links.py
