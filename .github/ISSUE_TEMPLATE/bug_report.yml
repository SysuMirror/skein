name: Bug report
description: Something does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include credentials, tokens or private
        repository names. Security issues go through SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or the output of `python -m skein version`
      placeholder: v0.1.0 / 1a2b3c4
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - docker compose (bundled demo)
        - systemd (deploy/scripts/install-control.sh)
        - local development (make run-control)
        - other
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: Login method
      description: What `GET /api/session` reports as `mode`
      options:
        - token
        - local
        - sso
        - not applicable
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        `journalctl -u skein-control -n 100`, `docker compose logs control`, or the output
        of `GET /internal/logs`. Redact anything private.
      render: text
    validations:
      required: false
