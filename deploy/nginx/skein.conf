# 控制台反代模板：把 skein.example.com 换成你的域名后，
# 放进 nginx 的 conf.d/（或已有的 custom.conf），先 nginx -t 再 reload。
# 证书：certbot certonly --webroot -w /var/www/certbot -d skein.example.com
#
# 两点必须保留：
#   - proxy_buffering off        ：控制台的 /internal/stream 是 SSE，不能缓冲
#   - /api/agent/channel 单独一段：节点用 WebSocket 拨入，需要 Upgrade 头

server {
    listen 80;
    server_name skein.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name skein.example.com;

    ssl_certificate     /etc/letsencrypt/live/skein.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skein.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    location /api/agent/channel {
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
